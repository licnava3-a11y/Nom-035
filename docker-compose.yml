version: "3.9"

# ─── Red interna ─────────────────────────────────────────────────────────────
networks:
  nom035_net:
    driver: bridge

# ─── Volúmenes persistentes ───────────────────────────────────────────────────
volumes:
  mysql_data:
  app_uploads:

# ─── Servicios ────────────────────────────────────────────────────────────────
services:

  # ── Base de datos MySQL ──────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: nom035_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword_CHANGE_ME}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nom035_db}
      MYSQL_USER: ${MYSQL_USER:-nom035_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nom035_password_CHANGE_ME}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - nom035_net
    ports:
      - "3306:3306"   # Exponer solo en desarrollo; comentar en producción
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword_CHANGE_ME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Aplicación NOM-035 ───────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nom035_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOCAL_AUTH: "true"

      # Base de datos
      DATABASE_URL: mysql://${MYSQL_USER:-nom035_user}:${MYSQL_PASSWORD:-nom035_password_CHANGE_ME}@db:3306/${MYSQL_DATABASE:-nom035_db}

      # Seguridad (CAMBIAR EN PRODUCCIÓN)
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_SECRET_IN_PRODUCTION_MIN_32_CHARS}

      # Configuración de la aplicación
      VITE_APP_TITLE: ${VITE_APP_TITLE:-Plataforma NOM-035 STPS 2018}
      VITE_APP_ID: local
      OAUTH_SERVER_URL: ""
      VITE_OAUTH_PORTAL_URL: ""
      OWNER_OPEN_ID: ""
      OWNER_NAME: ${OWNER_NAME:-Administrador}

      # SMTP para envío de correos (opcional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@tudominio.com}

      # LLM (opcional - para análisis de IA)
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY:-}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL:-}

    volumes:
      - app_uploads:/app/uploads
    networks:
      - nom035_net
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/mode"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx (proxy inverso + SSL) ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nom035_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # Certificados SSL (Let's Encrypt)
      - ./nginx/logs:/var/log/nginx
    networks:
      - nom035_net
    profiles:
      - production   # Solo se activa con: docker compose --profile production up
