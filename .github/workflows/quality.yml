name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality:
    name: Types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NODE_ENV: test
      PUPPETEER_SKIP_DOWNLOAD: "true"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check server types
        run: pnpm check:server

      - name: Check client types
        run: pnpm check:client

      - name: Check priority type safety
        run: pnpm check:type-safety

      - name: Run test suite sequentially
        run: pnpm exec vitest run --pool=forks --maxWorkers=1 --minWorkers=1

      - name: Prepare quality reports
        if: always()
        run: mkdir -p reports

      - name: Generate dependency audit report
        if: always()
        run: pnpm audit --prod --json > reports/dependency-audit.json || true

      - name: Build and generate bundle budget report
        if: success()
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            reports/dependency-audit.json
            reports/bundle-budget.json
            reports/bundle-budget.md
          if-no-files-found: warn
          retention-days: 30

      - name: Comment bundle budget on pull request
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nom035-bundle-budget -->';
            const reportPath = 'reports/bundle-budget.md';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'No se pudo generar el reporte de presupuesto de bundle.';
            const body = `${marker}\n## Presupuesto de bundle\n\n${report}\n\n_Reporte generado automáticamente por Quality Gate._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
