name: Static Safety & Format Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  static-safety:
    name: Static Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static safety checks
        run: pnpm check:type-safety
        continue-on-error: true
        id: static-safety

      - name: Comment PR with static safety results
        if: github.event_name == 'pull_request' && steps.static-safety.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `## 🔍 Static Safety Check Results\n\n❌ The project's type-safety checks found issues.\n\nRun \`pnpm check:type-safety\` locally to inspect them.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Fail if static safety checks find issues
        if: steps.static-safety.outcome == 'failure'
        run: exit 1

  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}"
        continue-on-error: true
        id: prettier

      - name: Comment PR with format results
        if: github.event_name == 'pull_request' && steps.prettier.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `## 💅 Prettier Format Check Results\n\n❌ Code formatting issues found.\n\nRun \`pnpm exec prettier --write "**/*.{ts,tsx,js,jsx,json,css,md}"\` to auto-format your code.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Fail if Prettier finds issues
        if: steps.prettier.outcome == 'failure'
        run: exit 1
