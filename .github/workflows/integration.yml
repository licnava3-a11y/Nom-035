name: Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Database and external services
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nom035_integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: true
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=2048
      PUPPETEER_SKIP_DOWNLOAD: "true"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/nom035_integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Synchronize isolated integration schema
        run: pnpm drizzle-kit push --force

      - name: Run integration suite sequentially
        run: pnpm test:integration --pool=forks --maxWorkers=1 --minWorkers=1
