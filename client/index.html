<!doctype html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Plataforma de Capacitación NOM-035 STPS 2018</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet" />
    <!-- Prefetch de módulos críticos para reducir tiempo de carga post-login -->
    <!-- Nota: En producción Vite genera hashes; estos hints aplican en dev y son ignorados si no existen -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <style>
      /* Spinner de carga inicial — se elimina cuando React monta */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 9999;
        font-family: 'Inter', system-ui, sans-serif;
        gap: 20px;
        transition: opacity 0.3s ease;
      }
      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .app-loading-logo {
        width: 64px;
        height: 64px;
        background: #0f172a;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 24px rgba(15,23,42,0.15);
      }
      .app-loading-logo svg {
        width: 36px;
        height: 36px;
        fill: none;
        stroke: #22c55e;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .app-loading-title {
        font-size: 15px;
        font-weight: 600;
        color: #0f172a;
        letter-spacing: -0.01em;
        text-align: center;
        max-width: 260px;
        line-height: 1.4;
      }
      .app-loading-subtitle {
        font-size: 12px;
        color: #64748b;
        text-align: center;
      }
      .app-loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Mensaje de estado visible después de 4 segundos (CSS puro, sin JS) */
      .app-loading-hint {
        font-size: 11px;
        color: #94a3b8;
        text-align: center;
        max-width: 220px;
        opacity: 0;
        animation: hint-appear 1s ease 4s forwards;
      }
      @keyframes hint-appear {
        to { opacity: 1; }
      }
    </style>
  <!-- Desregistrar Service Workers obsoletos antes de que React cargue -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(r) { r.unregister(); });
      });
      // Limpiar todos los caches del SW
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
    }
  </script>
  </head>

  <body>
    <!-- Spinner institucional visible antes de que React monte -->
    <div id="app-loading" aria-label="Cargando plataforma" role="status">
      <div class="app-loading-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="app-loading-title">Plataforma NOM-035 STPS 2018</div>
      <div class="app-loading-subtitle">Gestión Integral de Riesgos Psicosociales</div>
      <div class="app-loading-spinner"></div>
      <div class="app-loading-hint">Iniciando servidor... por favor espera</div>
    </div>

    <div id="root"></div>
    <div id="portal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
