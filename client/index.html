<!doctype html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Plataforma de Capacitación NOM-035 STPS 2018</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Plataforma de Gestión Integral de Riesgos Psicosociales NOM-035 STPS 2018" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOM-035" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet" />
    <style>
      /* ── Página de bienvenida estática (visible sin JS/React) ── */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; }

      #app-welcome {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 9999;
        gap: 16px;
        padding: 24px;
        transition: opacity 0.3s ease;
      }
      #app-welcome.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .aw-logo {
        width: 72px;
        height: 72px;
        background: #0f172a;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 24px rgba(15,23,42,0.18);
        margin-bottom: 4px;
      }
      .aw-logo svg {
        width: 40px;
        height: 40px;
        fill: none;
        stroke: #22c55e;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .aw-title {
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.02em;
        text-align: center;
        max-width: 280px;
        line-height: 1.3;
      }
      .aw-subtitle {
        font-size: 13px;
        color: #64748b;
        text-align: center;
        max-width: 240px;
        line-height: 1.5;
      }
      .aw-btn {
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #22c55e;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 13px 32px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 2px 12px rgba(34,197,94,0.3);
        transition: background 0.15s;
        min-width: 200px;
        text-align: center;
      }
      .aw-btn:hover { background: #16a34a; }
      .aw-loading {
        font-size: 12px;
        color: #94a3b8;
        text-align: center;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .aw-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #e2e8f0;
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .aw-badge {
        font-size: 11px;
        color: #94a3b8;
        text-align: center;
        margin-top: 4px;
      }
    </style>
  <!-- Desregistrar Service Workers obsoletos -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(r) {
        r.forEach(function(sw) { sw.unregister(); });
      });
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
    }
  </script>
  </head>

  <body>
    <!-- ── Pantalla de carga institucional (app-loading) ── -->
    <!-- Visible INMEDIATAMENTE sin necesidad de React ni JS de módulos -->
    <!-- Se oculta cuando React monta (ver main.tsx: hideAppLoading) -->
    <!-- id="app-loading" es el alias canónico; id="app-welcome" se mantiene por compatibilidad -->
    <div id="app-welcome" data-id="app-loading" role="main" aria-label="Bienvenida a la plataforma NOM-035">
    <!-- app-loading spinner institucional NOM-035 -->
      <div class="aw-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="aw-title">Plataforma NOM-035 STPS 2018</div>
      <div class="aw-subtitle">Gestión Integral de Riesgos Psicosociales</div>

      <!-- Botón de login: se construye con script inline sin dependencias -->
      <a id="aw-login-btn" class="aw-btn" href="#" onclick="return false;">
        Iniciar sesión
      </a>

      <!-- Indicador de carga de la app React (se oculta cuando React monta) -->
      <div id="aw-loading-indicator" class="aw-loading">
        <div class="aw-spinner"></div>
        <span>Cargando aplicación…</span>
      </div>

      <div class="aw-badge">NOM-035-STPS-2018 · Factores de Riesgo Psicosocial</div>
    </div>

    <!-- Script inline: construye la URL de OAuth sin React ni módulos -->
    <!-- Ejecuta en <1ms, funciona incluso si React nunca carga -->
    <script>
      (function() {
        try {
          var appId = '%VITE_APP_ID%';
          var oauthPortal = '%VITE_OAUTH_PORTAL_URL%';

          // El servidor reemplaza %VITE_*% en runtime (serveStatic en vite.ts).
          // Solo usar fallback si el placeholder NO fue reemplazado (string literal intacto).
          var APP_ID_PLACEHOLDER = '%VITE' + '_APP_ID%';
          var PORTAL_PLACEHOLDER = '%VITE' + '_OAUTH_PORTAL_URL%';
          if (!appId || appId === APP_ID_PLACEHOLDER) appId = '';
          if (!oauthPortal || oauthPortal === PORTAL_PLACEHOLDER) {
            oauthPortal = 'https://manus.im';
          }

          // redirectUri: the callback URL registered with the OAuth portal.
          // The server uses this EXACT path in the token exchange.
          var redirectUri = window.location.origin + '/api/oauth/callback';

          // state: encodes where to send the user AFTER login (NOT the redirectUri).
          // Using btoa('/') sends the user to the home page after successful login.
          var state = btoa('/');

          var loginUrl = oauthPortal + '/app-auth'
            + '?appId=' + encodeURIComponent(appId)
            + '&redirectUri=' + encodeURIComponent(redirectUri)
            + '&state=' + encodeURIComponent(state)
            + '&responseType=code';

          var btn = document.getElementById('aw-login-btn');
          if (btn) {
            btn.href = loginUrl;
            btn.onclick = null;
          }
        } catch(e) {
          // Si falla, el botón sigue visible pero sin href funcional
          console.warn('[NOM-035] No se pudo construir la URL de login:', e);
        }
      })();
    </script>

    <div id="root"></div>
    <div id="portal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
