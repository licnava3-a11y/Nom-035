<!doctype html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Plataforma de Capacitación NOM-035 STPS 2018</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet" />
    <style>
      /* Spinner de carga inicial — se elimina cuando React monta */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 9999;
        font-family: 'Inter', system-ui, sans-serif;
        gap: 20px;
        transition: opacity 0.3s ease;
      }
      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .app-loading-logo {
        width: 64px;
        height: 64px;
        background: #0f172a;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 24px rgba(15,23,42,0.15);
      }
      .app-loading-logo svg {
        width: 36px;
        height: 36px;
        fill: none;
        stroke: #22c55e;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .app-loading-title {
        font-size: 15px;
        font-weight: 600;
        color: #0f172a;
        letter-spacing: -0.01em;
        text-align: center;
        max-width: 260px;
        line-height: 1.4;
      }
      .app-loading-subtitle {
        font-size: 12px;
        color: #64748b;
        text-align: center;
      }
      .app-loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <!-- Spinner institucional visible antes de que React monte -->
    <div id="app-loading" aria-label="Cargando plataforma" role="status">
      <div class="app-loading-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="app-loading-title">Plataforma NOM-035 STPS 2018</div>
      <div class="app-loading-subtitle">Gestión Integral de Riesgos Psicosociales</div>
      <div class="app-loading-spinner"></div>
    </div>

    <div id="root"></div>
    <div id="portal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
